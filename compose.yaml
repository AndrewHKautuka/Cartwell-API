services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cartwell}
    ports:
      - "5432:5432"
    volumes:
      - cartwell_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cartwell}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cartwell:
    image: cartwell
    build:
      context: .
      dockerfile: Cartwell/Dockerfile
    depends_on:
      db:
        condition: service_healthy

volumes:
  cartwell_db: {}

